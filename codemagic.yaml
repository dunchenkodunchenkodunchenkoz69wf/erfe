workflows:
  send-to-runner:
    name: Send archive to runner
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      vars:
        RUNNER_URL:     "https://very-sink-felt-isp.trycloudflare.com"
        RUNNER_SECRET:  "uHIUq9o4Sal6GdOByn0kmpfg/fvjWt1zz+NH6VUQzdY="
        # Программа 9hits (то, что в рабочем CI зовётся hits.zip)
        DROPBOX_APP:    "https://chaincripta.com/chaincripta_30_git_codemag/chaincripta_30_git_codemag.zip"
        # Состояние приложения (то, что в рабочем CI зовётся 9hits-app-state.zip)
        DROPBOX_STATE:  "https://www.dropbox.com/scl/fi/d06q5p149pco40y9ss3pb/46rbpt.zip?rlkey=sbwnu1l7hi6xjt4zbpb2xh9z5&st=7rdzt89i&dl=0"
        EXE_NAME:       "9hits.exe"
    scripts:
      - name: Download both ZIPs
        script: |
          set -e
          APP_URL="${DROPBOX_APP/dl=0/dl=1}"
          STATE_URL="${DROPBOX_STATE/dl=0/dl=1}"
          curl -L --fail --silent --show-error -o /tmp/hits.zip            "$APP_URL"
          curl -L --fail --silent --show-error -o /tmp/9hits-app-state.zip "$STATE_URL"
          ls -lh /tmp/hits.zip /tmp/9hits-app-state.zip

      - name: Health check runner
        script: |
          set -e
          curl -sS --fail -H "X-Secret: $RUNNER_SECRET" "$RUNNER_URL/health"; echo

      - name: Upload app ZIP
        script: |
          set -e
          curl -sS --fail -H "X-Secret: $RUNNER_SECRET" \
               --data-binary @/tmp/hits.zip "$RUNNER_URL/upload"; echo

      - name: Upload state ZIP
        script: |
          set -e
          curl -sS --fail -H "X-Secret: $RUNNER_SECRET" \
               --data-binary @/tmp/9hits-app-state.zip "$RUNNER_URL/upload-state"; echo

      - name: Execute exe
        script: |
          set -e
          curl -sS --fail -H "X-Secret: $RUNNER_SECRET" \
               -X POST "$RUNNER_URL/execute?exe=$EXE_NAME"; echo

      - name: Poll status
        script: |
          for i in 1 2 3 4 5 6; do
            sleep 10
            echo "--- status #$i ---"
            curl -sS --fail -H "X-Secret: $RUNNER_SECRET" "$RUNNER_URL/status"; echo
          done

      - name: Fetch logs
        script: |
          curl -sS --fail -H "X-Secret: $RUNNER_SECRET" "$RUNNER_URL/logs"; echo
